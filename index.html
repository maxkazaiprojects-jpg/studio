<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Студия нарезок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0820;--panel:#140f33;--panel2:#1b1542;--line:#2e2566;--fg:#e9e4ff;--dim:#8f86c2;
  --pink:#ff4fd8;--cyan:#38e8ff;--lime:#9dff4f;--amber:#ffc23d;--red:#ff4f6a;--violet:#9b6bff;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "JetBrains Mono",ui-monospace,Menlo,monospace;
  background-image:radial-gradient(1200px 500px at 50% -10%,#2a1a6b 0%,transparent 60%),repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);
  min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,.px{font-family:"Press Start 2P",monospace;letter-spacing:.04em;font-weight:400}
h1{font-size:clamp(15px,3.2vw,24px);margin:0;color:#fff;text-shadow:0 0 12px var(--pink),0 0 2px #fff;text-wrap:balance}
h2{font-size:11px;margin:0 0 12px;color:var(--cyan);text-shadow:0 0 8px rgba(56,232,255,.5)}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:18px}
.upd{color:var(--dim);font-size:12px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;position:relative;overflow:hidden}
.chip b{display:block;font:400 18px "Press Start 2P",monospace;margin-top:6px}
.chip span{color:var(--dim);font-size:12px}
.chip::after{content:"";position:absolute;inset:auto 0 0 0;height:2px;background:var(--c,var(--cyan));box-shadow:0 0 10px var(--c,var(--cyan))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.floor{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.desk{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0;position:relative}
.desk canvas{width:100%;image-rendering:pixelated;display:block;border-radius:6px;background:#0e0a28}
.desk .nm{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.desk .nm b{font:400 10px "Press Start 2P",monospace}
.desk .role{color:var(--dim);font-size:11px;margin-top:2px}
.desk .task{font-size:11px;margin-top:6px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font:400 8px "Press Start 2P",monospace;padding:4px 6px;border-radius:4px;white-space:nowrap}
.st.work{background:rgba(157,255,79,.15);color:var(--lime)}
.st.idle{background:rgba(143,134,194,.15);color:var(--dim)}
.st.wait{background:rgba(255,194,61,.15);color:var(--amber)}
.st.error{background:rgba(255,79,106,.15);color:var(--red)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px;align-items:start}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.ok{border-color:rgba(255,194,61,.5);box-shadow:0 0 0 1px rgba(255,194,61,.15),0 0 24px rgba(255,194,61,.08)}
.ok h2{color:var(--amber);text-shadow:0 0 8px rgba(255,194,61,.5)}
.item{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0}
.item .t{flex:0 0 auto;font-size:12px;color:var(--cyan);min-width:46px}
.item .x{min-width:0;flex:1}
.item .x b{font-weight:600}
.item .x small{display:block;color:var(--dim);font-size:11px}
.day{font:400 9px "Press Start 2P",monospace;color:var(--pink);margin:12px 0 4px}
.day:first-of-type{margin-top:0}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--dim);font-weight:400;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid rgba(46,37,102,.6);vertical-align:top}
td.id{color:var(--dim);white-space:nowrap}
.bd{display:inline-block;font-size:10px;padding:2px 6px;border-radius:4px;white-space:nowrap}
.bd.plan{background:rgba(56,232,255,.12);color:var(--cyan)}
.bd.sent{background:rgba(255,194,61,.14);color:var(--amber)}
.bd.ready{background:rgba(157,255,79,.12);color:var(--lime)}
.bd.old{background:rgba(143,134,194,.12);color:var(--dim)}
.bd.hold{background:rgba(255,79,106,.12);color:var(--red)}
.bd.posted{background:rgba(255,79,216,.14);color:var(--pink)}
.log .item .t{min-width:70px;color:var(--dim)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{font:400 8px "Press Start 2P",monospace;background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:7px 9px;cursor:pointer}
.tabs button[aria-pressed=true]{color:#fff;border-color:var(--pink);box-shadow:0 0 10px rgba(255,79,216,.35)}
#lock{max-width:420px;margin:12vh auto;text-align:center}
#lock form{display:flex;gap:8px;margin-top:16px}
#lock input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:10px;font:inherit}
#lock button{background:var(--pink);color:#1a0820;border:0;border-radius:8px;padding:10px 14px;font:400 9px "Press Start 2P",monospace;cursor:pointer}
#lock p{color:var(--dim)}
.err{color:var(--red);font-size:12px;min-height:1.5em}
.empty{color:var(--dim);font-size:12px}
footer{color:var(--dim);font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div id="lock" hidden>
    <h1>СТУДИЯ<br>НАРЕЗОК</h1>
    <p>Данные зашифрованы. Открой ссылку с ключом (#k=…) или вставь ключ.</p>
    <form id="keyBox"><input id="keyIn" placeholder="ключ" autocomplete="off"><button>ОК</button></form>
    <div class="err" id="keyMsg"></div>
  </div>
  <div id="app" hidden>
    <header>
      <div>
        <h1>СТУДИЯ НАРЕЗОК</h1>
        <div class="upd" id="upd"></div>
      </div>
      <div class="upd">Мак рендерит · Кира монтирует · ты одобряешь</div>
    </header>
    <div class="chips" id="chips"></div>
    <div class="floor" id="floor"></div>
    <div class="grid2">
      <div class="card ok"><h2>НУЖЕН ТВОЙ ОК</h2><div id="okList"></div></div>
      <div class="card"><h2>ПЛАН ПУБЛИКАЦИЙ</h2><div id="plan"></div></div>
    </div>
    <div class="grid2">
      <div class="card log"><h2>ОЧЕРЕДЬ МАКА</h2><div id="log"></div></div>
      <div class="card"><h2>КЛИПЫ</h2>
        <div class="tabs" id="tabs"></div>
        <div class="tw"><table><thead><tr><th>клип</th><th>стример</th><th>статус</th><th>МБ</th></tr></thead><tbody id="clips"></tbody></table></div>
      </div>
    </div>
    <footer>Одобрять — словом в Telegram. Панель обновляется сама раз в минуту.</footer>
  </div>
</div>
<script>
var KEYLS="studio-key",TABLS="studio-tab";
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
(function(){var h=(location.hash||"").slice(1);
  if(h.indexOf("k=")===0){try{localStorage.setItem(KEYLS,decodeURIComponent(h.slice(2)))}catch(e){}window.__k=decodeURIComponent(h.slice(2));try{history.replaceState(null,"",location.pathname)}catch(e){}}})();
function getKey(){try{return localStorage.getItem(KEYLS)||window.__k}catch(e){return window.__k||null}}
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function decrypt(enc,pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)},key,b64(enc.ct))));
}

/* ---------- сотрудники студии и пиксельные спрайты ---------- */
var STAFF=[
  {id:"kira",name:"КИРА",role:"продюсер: выбирает, монтирует",hair:"#ff4fd8",shirt:"#9b6bff",screen:"#ff4fd8"},
  {id:"scout",name:"СКАУТ",role:"ищет моменты в стримах",hair:"#ffc23d",shirt:"#2fb6d6",screen:"#38e8ff"},
  {id:"ear",name:"СЛУХАЧ",role:"слушает чат эфира",hair:"#5a3a22",shirt:"#4fbf6a",screen:"#9dff4f"},
  {id:"editor",name:"МОНТАЖЁР",role:"режет, субтитры, баннер",hair:"#1d1d2e",shirt:"#ff6a3d",screen:"#ffc23d"},
  {id:"artist",name:"ХУДОЖНИК",role:"рисует фоны",hair:"#e8e8f0",shirt:"#ff4f6a",screen:"#ff4fd8"},
  {id:"pub",name:"ПУБЛИКАТОР",role:"ждёт твоего «публикуй»",hair:"#7a4fff",shirt:"#ffc23d",screen:"#38e8ff"}
];
// 10×12 человечек: h волосы, s кожа, e глаза, c рубашка, d тёмный
var BODY=[
"..hhhhhh..",
".hhhhhhhh.",
".hssssssh.",
".sseesses.",
".ssssssss.",
"..ssmmss..",
"...ssss...",
".cccccccc.",
"cccccccccc",
"cscccccccs",
"ss.cccc.ss",
"...dddd..."];
function sprite(ctx,x,y,p,f,sleep){
  var pal={h:p.hair,s:"#f2c29b",e:sleep?"#c98f6a":"#1a1030",m:"#b5574d",c:p.shirt,d:"#2a2250"};
  for(var r=0;r<BODY.length;r++)for(var c=0;c<10;c++){var ch=BODY[r][c];if(ch===".")continue;
    var yy=y+r;
    if(r>=9&&(ch==="s")&&!sleep){yy+=(f%2?0:1)*(c<5?1:0)+(f%2?1:0)*(c>=5?1:0)} // руки печатают
    ctx.fillStyle=pal[ch];ctx.fillRect(x+c,yy,1,1)}
}
function scene(cv,p,state,t,task){
  var ctx=cv.getContext("2d"),W=cv.width,H=cv.height;ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#120d30";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#1a1442";for(var i=0;i<W;i+=6)ctx.fillRect(i,24,3,1);           // стена/пол
  ctx.fillStyle="#191340";ctx.fillRect(0,25,W,H-25);
  var work=state==="work",sleep=state==="idle",err=state==="error",wait=state==="wait";
  var f=Math.floor(t/180);
  // монитор
  var mx=3,my=6;
  ctx.fillStyle="#2a2250";ctx.fillRect(mx-1,my-1,20,13);
  var sc=err?"#ff4f6a":(sleep?"#221a4a":p.screen);
  ctx.fillStyle=sc;ctx.globalAlpha=sleep?1:(0.55+0.25*Math.sin(t/300));ctx.fillRect(mx,my,18,11);ctx.globalAlpha=1;
  if(work){ctx.fillStyle="#0e0a28";for(var k=0;k<4;k++){var w=3+((f+k*3)%12);ctx.fillRect(mx+2,my+2+k*2,w,1)}}
  if(err){ctx.fillStyle="#0e0a28";ctx.fillRect(mx+8,my+2,2,5);ctx.fillRect(mx+8,my+8,2,2)}
  if(wait){ctx.fillStyle="#0e0a28";var on=Math.floor(t/500)%2;ctx.fillRect(mx+3,my+4,3,3);ctx.fillRect(mx+8,my+4,3,3);if(on)ctx.fillRect(mx+13,my+4,3,3)}
  ctx.fillStyle="#2a2250";ctx.fillRect(mx+7,my+12,4,2);
  // стол
  ctx.fillStyle="#3a2f7a";ctx.fillRect(0,20,W,2);ctx.fillStyle="#241c55";ctx.fillRect(2,22,2,8);ctx.fillRect(W-4,22,2,8);
  // человечек
  var bob=work?(f%2):(sleep?0:Math.floor(t/700)%2);
  sprite(ctx,26,9+bob+(sleep?1:0),p,f,sleep);
  // свет от экрана на лице
  if(!sleep){ctx.fillStyle=sc;ctx.globalAlpha=.12;ctx.fillRect(21,7,16,14);ctx.globalAlpha=1}
  // zZ / !
  ctx.font="5px monospace";
  if(sleep){ctx.fillStyle="#8f86c2";var z=Math.floor(t/600)%3;ctx.fillText("z",38,9-z);if(z>0)ctx.fillText("Z",42,6-z)}
  if(err){ctx.fillStyle="#ff4f6a";ctx.fillText("!",39,9)}
  if(wait){ctx.fillStyle="#ffc23d";ctx.fillText("?",39,9-(Math.floor(t/400)%2))}
}
var DATA=null,CVS=[],T0=performance.now();
function fmtTime(ts){var d=new Date(ts*1000);return d.toLocaleString("ru-RU",{timeZone:"Europe/Moscow",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function ago(ts){var s=Date.now()/1000-ts;if(s<90)return"только что";if(s<3600)return Math.round(s/60)+" мин назад";if(s<86400)return Math.round(s/3600)+" ч назад";return Math.round(s/86400)+" дн назад"}
var ST_TXT={work:"РАБОТАЕТ",idle:"СПИТ",wait:"ЖДЁТ ТЕБЯ",error:"ОШИБКА"};
var BD={plan:"в плане",sent:"ждёт ОК",ready:"готов",old:"старая версия",hold:"не публиковать",posted:"выложен"};
var MODE={scan:"ищет пики в записи",frames:"кадры",clips:"топ-клипы Twitch",live:"живая нарезка",cut:"монтаж",bg:"фон"};

function render(){
  var d=DATA;$("upd").textContent="обновлено "+ago(d.updated)+" · "+fmtTime(d.updated)+" МСК";
  var cl=d.clips,cnt=function(s){return cl.filter(function(c){return c.status===s}).length};
  var day=Date.now()/1000-86400,r24=d.tasks.filter(function(t){return t.state==="done"&&t.done>day}).length;
  var q=d.tasks.filter(function(t){return t.state==="queue"||t.state==="work"}).length;
  $("chips").innerHTML=[["клипов готово",cl.filter(function(c){return c.status!=="old"}).length,"--lime"],["в плане",cnt("plan"),"--cyan"],["ждут твой ОК",cnt("sent"),"--amber"],["рендеров за 24 ч",r24,"--pink"],["в очереди Мака",q,"--violet"]]
    .map(function(x){return '<div class="chip" style="--c:var('+x[2]+')"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>'}).join("");
  // сотрудники
  var ag=d.agents||{},sent=cnt("sent");
  var st={kira:{state:"work",task:"монтирует и ведёт план",last:d.updated},pub:{state:sent?"wait":"idle",task:sent?("ждёт ОК: "+sent+" клип(а)"):"всё одобрено",last:d.updated}};
  STAFF.forEach(function(p){if(!st[p.id])st[p.id]=ag[p.id]||{state:"idle",task:"пока без задач",last:0}});
  if(!CVS.length){$("floor").innerHTML=STAFF.map(function(p,i){return '<div class="desk"><canvas width="48" height="30" id="cv'+i+'"></canvas><div class="nm"><b>'+p.name+'</b><span class="st" id="st'+i+'"></span></div><div class="role">'+p.role+'</div><div class="task" id="tk'+i+'"></div></div>'}).join("");
    CVS=STAFF.map(function(p,i){return $("cv"+i)})}
  STAFF.forEach(function(p,i){var s=st[p.id];p._s=s.state;var e=$("st"+i);e.className="st "+s.state;e.textContent=ST_TXT[s.state]||s.state;
    var m=(s.task||"").split(" ");$("tk"+i).textContent=(MODE[m[0]]?MODE[m[0]]+": "+m.slice(1).join(" "):s.task)+(s.last&&p.id!=="kira"&&p.id!=="pub"?" · "+ago(s.last):"");$("tk"+i).title=$("tk"+i).textContent});
  // ОК
  var ok=cl.filter(function(c){return c.status==="sent"});
  $("okList").innerHTML=ok.length?ok.map(function(c){return '<div class="item"><div class="t">'+(c.rating?c.rating+"/10":"—")+'</div><div class="x"><b>'+esc(c.title)+'</b><small>'+esc(c.id)+' · '+esc(c.nick)+(c.note?' · '+esc(c.note):'')+'</small></div></div>'}).join(""):'<div class="empty">Пусто — всё одобрено.</div>';
  // план
  var byId={};cl.forEach(function(c){byId[c.id]=c});var cur="",h="";
  var today=new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Moscow"});
  d.plan.forEach(function(p){if(p.date<today)return;if(p.date!==cur){cur=p.date;var dd=new Date(p.date+"T12:00:00");h+='<div class="day">'+dd.toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"}).toUpperCase()+'</div>'}
    var c=byId[p.clip]||{title:p.clip,nick:""};h+='<div class="item"><div class="t">'+(p.time||"—")+'</div><div class="x"><b>'+esc(c.title)+'</b><small>'+esc(c.nick)+(p.note?' · '+esc(p.note):'')+'</small></div></div>'});
  $("plan").innerHTML=h||'<div class="empty">План пуст.</div>';
  // очередь
  var SL={queue:"в очереди",work:"идёт",done:"готово",error:"ошибка",lost:"не взял"};
  $("log").innerHTML=d.tasks.slice().reverse().slice(0,14).map(function(t){return '<div class="item"><div class="t">'+fmtTime(t.done||t.at).slice(-5)+'</div><div class="x"><b>'+esc(MODE[t.mode]||t.mode)+'</b> '+esc(t.args)+'<small>'+(SL[t.state]||t.state)+' · '+ago(t.done||t.at)+'</small></div></div>'}).join("")||'<div class="empty">Пусто.</div>';
  renderClips();
}
var TAB="active";try{TAB=localStorage.getItem(TABLS)||"active"}catch(e){}
function renderClips(){
  var tabs=[["active","актуальные"],["sent","ждут ОК"],["plan","в плане"],["old","старые"],["all","все"]];
  $("tabs").innerHTML=tabs.map(function(t){return '<button data-t="'+t[0]+'" aria-pressed="'+(TAB===t[0])+'">'+t[1]+'</button>'}).join("");
  var cl=DATA.clips.filter(function(c){return TAB==="all"||(TAB==="active"?(c.status!=="old"&&c.status!=="hold"):c.status===TAB)});
  $("clips").innerHTML=cl.map(function(c){return '<tr><td><b>'+esc(c.title)+'</b><div class="id">'+esc(c.id)+(c.banner?' · баннер':'')+'</div></td><td>'+esc(c.nick)+'</td><td><span class="bd '+c.status+'">'+(BD[c.status]||c.status)+'</span></td><td>'+c.mb+'</td></tr>'}).join("")||'<tr><td colspan="4" class="empty">Нет клипов.</td></tr>';
}
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;TAB=b.dataset.t;try{localStorage.setItem(TABLS,TAB)}catch(x){}renderClips()});
function loop(){var t=performance.now()-T0;CVS.forEach(function(cv,i){scene(cv,STAFF[i],STAFF[i]._s||"idle",t+i*137)});requestAnimationFrame(loop)}

async function load(){
  var k=getKey();if(!k){$("lock").hidden=false;$("app").hidden=true;return}
  try{var r=await fetch("data.enc.json?"+Date.now(),{cache:"no-store"});DATA=await decrypt(await r.json(),k);
    $("lock").hidden=true;$("app").hidden=false;render()}
  catch(e){if(!DATA){$("lock").hidden=false;$("app").hidden=true;$("keyMsg").textContent="Ключ не подошёл или данных пока нет."}}
}
$("keyBox").addEventListener("submit",function(ev){ev.preventDefault();var v=$("keyIn").value.trim();if(!v)return;try{localStorage.setItem(KEYLS,v)}catch(e){}window.__k=v;$("keyMsg").textContent="";load()});
load();setInterval(load,60000);requestAnimationFrame(loop);
</script>
</body>
</html>
